<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pruebas del validador de evento</title>
  <style>
    :root { color-scheme: dark; --bg: #0A0A0B; --panel: #141416; --border: #2a2a2e; --bone: #F2F2EE; --fog: #9a9aa2; --lime: #C6F432; --red: #FF4D4D; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--bone); font: 15px/1.45 system-ui, sans-serif; }
    main { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 4px; }
    p.sub { color: var(--fog); margin: 0 0 16px; }
    #total { font-size: 1.1rem; font-weight: 600; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); margin-bottom: 16px; }
    #total.ok { color: var(--lime); }
    #total.mal { color: var(--red); }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--fog); font-weight: 500; font-size: 0.8125rem; }
    td.estado { font-weight: 700; white-space: nowrap; width: 72px; }
    td.estado.pasa { color: var(--lime); }
    td.estado.falla { color: var(--red); }
    td small { color: var(--fog); display: block; }
  </style>
</head>
<body>
<main>
  <h1>Pruebas del validador de evento</h1>
  <p class="sub">shared/validador-evento.js · función pura, sin hardware. Cada fila es una regla o un caso borde.</p>
  <div id="total" role="status">Ejecutando…</div>
  <table>
    <thead><tr><th>Resultado</th><th>Caso</th></tr></thead>
    <tbody id="filas"></tbody>
  </table>
</main>

<script src="motor-plantillas.js"></script>
<script src="validador-evento.js"></script>
<script src="almacen-eventos.js"></script>
<script src="almacen-plantillas.js"></script>
<script src="respaldo.js"></script>
<script>
(function () {
  'use strict';

  // ---------- Datos base (un evento perfecto, sin bloqueos ni avisos) ----------
  function foto(n) { return { id: 'f' + n, tipo: 'foto', numero: n, visible: true, xMm: 3, yMm: 3 + (n - 1) * 40, anchoMm: 44, altoMm: 33, rotacion: 0 }; }
  function plantilla(fotos, papel) {
    var el = [];
    for (var i = 1; i <= fotos; i++) el.push(foto(i));
    return { id: 'pl-1', nombre: 'Tira de prueba', papel: papel || { anchoMm: 50.8, altoMm: 152.4, ppp: 300, duplicarEnHoja: true }, elementos: el };
  }
  function evento(extra) {
    var e = {
      version: 2, id: 'ev-1', nombre: 'Boda', fecha: '2026-12-01', estado: 'proximo',
      entrega: { modo: 'ambos', copias: 1, impresionAuto: true },
      plantillas: { habilitadas: ['pl-1'], porDefecto: 'pl-1' },
      ritmo: { cuentaSeg: 3, pausaSeg: 3, mensajePausa: 'x', pacienciaSeg: 30 },
    };
    for (var k in (extra || {})) e[k] = extra[k];
    return e;
  }
  function base() {
    return {
      equipo: { pin: { definido: true } },
      evento: evento(),
      plantilla: plantilla(3),
      vivo: {
        camaras: [{ id: 'c1', etiqueta: 'Webcam', activa: true, anchoPx: 1920, altoPx: 1080 }],
        impresora: { estado: 'lista', segundosPorHoja: 20, medios: [{ anchoMm: 101.6, altoMm: 152.4 }] },
        espacioLibreMB: 50000,
      },
    };
  }

  var V = ValidadorEvento;
  function codigos(lista) { return lista.map(function (x) { return x.codigo; }); }
  function tiene(lista, c) { return codigos(lista).indexOf(c) !== -1; }
  function formaOk(lista) {
    return lista.every(function (x) {
      return typeof x.codigo === 'string' && V.CODIGOS.indexOf(x.codigo) !== -1 && (x.gravedad === 'bloqueo' || x.gravedad === 'aviso') &&
        typeof x.mensaje === 'string' && x.mensaje.length > 5 && x.accion && x.accion.etiqueta && x.accion.destino;
    });
  }

  // Cada caso: nombre, cómo se cambia la entrada base, y qué se espera del resultado.
  var casos = [];
  function caso(nombre, cambiar, espera, detalle) { casos.push({ nombre: nombre, cambiar: cambiar, espera: espera, detalle: detalle || '' }); }

  caso('Evento perfecto: listo, sin bloqueos ni avisos', function (e) {}, function (r) { return r.listo && r.bloqueos.length === 0 && r.avisos.length === 0; });
  caso('Todos los bloqueos y avisos traen código estable, mensaje y acción', function (e) { e.plantilla = null; e.vivo.camaras = []; e.vivo.impresora = null; e.equipo.pin.definido = false; },
    function (r) { return formaOk(r.bloqueos) && formaOk(r.avisos) && r.bloqueos.length >= 2 && r.avisos.length >= 2; });

  // Plantilla
  caso('Sin plantilla asignada: bloquea (PLANTILLA_SIN_ASIGNAR)', function (e) { e.evento.plantillas.porDefecto = null; e.plantilla = null; },
    function (r) { return !r.listo && tiene(r.bloqueos, 'PLANTILLA_SIN_ASIGNAR') && r.bloqueos[0].accion.destino === 'editor-plantillas'; });
  caso('Plantilla asignada pero ya no existe (null): bloquea (PLANTILLA_NO_ENCONTRADA)', function (e) { e.plantilla = null; },
    function (r) { return !r.listo && tiene(r.bloqueos, 'PLANTILLA_NO_ENCONTRADA') && !tiene(r.bloqueos, 'PLANTILLA_SIN_ASIGNAR'); });
  caso('Plantilla ilegible (marcador): bloquea (PLANTILLA_ILEGIBLE)', function (e) { e.plantilla = V.ILEGIBLE; },
    function (r) { return tiene(r.bloqueos, 'PLANTILLA_ILEGIBLE'); });
  caso('Plantilla dañada (sin papel válido): bloquea (PLANTILLA_DANADA)', function (e) { e.plantilla.papel = { anchoMm: 0, altoMm: 0 }; },
    function (r) { return tiene(r.bloqueos, 'PLANTILLA_DANADA'); });
  caso('Plantilla que no es un objeto: bloquea (PLANTILLA_DANADA)', function (e) { e.plantilla = 'basura'; },
    function (r) { return tiene(r.bloqueos, 'PLANTILLA_DANADA'); });
  caso('Plantilla sin elementos (no es lista): bloquea (PLANTILLA_DANADA)', function (e) { delete e.plantilla.elementos; },
    function (r) { return tiene(r.bloqueos, 'PLANTILLA_DANADA') && !tiene(r.bloqueos, 'PLANTILLA_SIN_FOTOS'); });
  caso('Plantilla sin ninguna foto: bloquea (PLANTILLA_SIN_FOTOS)', function (e) { e.plantilla.elementos = []; },
    function (r) { return tiene(r.bloqueos, 'PLANTILLA_SIN_FOTOS'); });
  caso('Plantilla con fotos con huecos de numeración: bloquea (PLANTILLA_DANADA)', function (e) { e.plantilla.elementos[2].numero = 5; },
    function (r) { return tiene(r.bloqueos, 'PLANTILLA_DANADA'); });
  caso('null y dañada dan códigos distintos', function (e) {}, function () {
    var a = V.validar(Object.assign(base(), { plantilla: null }));
    var b = V.validar(Object.assign(base(), { plantilla: { papel: { anchoMm: 0, altoMm: 0 }, elementos: [] } }));
    return codigos(a.bloqueos).join() !== codigos(b.bloqueos).join();
  });

  // Evento
  caso('Evento archivado: bloquea (EVENTO_ARCHIVADO) con mensaje de reabrir', function (e) { e.evento.estado = 'archivado'; },
    function (r) { return !r.listo && tiene(r.bloqueos, 'EVENTO_ARCHIVADO') && /reábrelo/.test(r.bloqueos[0].mensaje); });
  caso('Evento v1 sin migrar: bloquea (EVENTO_FORMATO_ANTIGUO) y no revienta', function (e) { e.evento = { id: 'x', nombre: 'Viejo', estado: 'proximos', entrega: 'impresion', plantillaId: 'pl-1' }; },
    function (r) { return !r.listo && tiene(r.bloqueos, 'EVENTO_FORMATO_ANTIGUO'); });
  caso('Evento null: bloquea (EVENTO_NO_VALIDO)', function (e) { e.evento = null; }, function (r) { return !r.listo && tiene(r.bloqueos, 'EVENTO_NO_VALIDO'); });
  caso('Entrada vacía o null no lanza excepción', function (e) {}, function () {
    var a = V.validar(undefined), b = V.validar(null), c = V.validar({});
    return !a.listo && !b.listo && !c.listo;
  });

  // Cámara
  caso('Lista de cámaras vacía: bloquea (SIN_CAMARA)', function (e) { e.vivo.camaras = []; },
    function (r) { return !r.listo && tiene(r.bloqueos, 'SIN_CAMARA') && r.bloqueos.filter(function (b) { return b.codigo === 'SIN_CAMARA'; })[0].accion.destino === 'conectar-camara'; });
  caso('Cámaras null (no se pudo saber): solo avisa (CAMARA_NO_COMPROBADA)', function (e) { e.vivo.camaras = null; },
    function (r) { return r.listo && tiene(r.avisos, 'CAMARA_NO_COMPROBADA') && !tiene(r.bloqueos, 'SIN_CAMARA'); });
  caso('Resolución justa de la cámara: avisa (RESOLUCION_JUSTA)', function (e) { e.vivo.camaras = [{ id: 'c', activa: true, anchoPx: 320, altoPx: 240 }]; },
    function (r) { return r.listo && tiene(r.avisos, 'RESOLUCION_JUSTA'); });
  caso('Cámara sin dato de resolución: no avisa por resolución', function (e) { e.vivo.camaras = [{ id: 'c', etiqueta: 'Cámara' }]; },
    function (r) { return r.listo && !tiene(r.avisos, 'RESOLUCION_JUSTA'); });
  caso('Cámara 16:9 con resolución suficiente tras el recorte: no avisa', function (e) { e.vivo.camaras = [{ id: 'c', activa: true, anchoPx: 1280, altoPx: 720 }]; },
    function (r) { return !tiene(r.avisos, 'RESOLUCION_JUSTA'); });

  // Impresora y modo
  caso('Impresión + impresora con problema (sin papel): bloquea (IMPRESORA_CON_PROBLEMA)', function (e) { e.evento.entrega.modo = 'impresion'; e.vivo.impresora = { estado: 'sin-papel' }; },
    function (r) { return !r.listo && tiene(r.bloqueos, 'IMPRESORA_CON_PROBLEMA'); });
  caso('Ambos + impresora con problema: también bloquea (decisión D2 ajustada)', function (e) { e.evento.entrega.modo = 'ambos'; e.vivo.impresora = { estado: 'desconectada' }; },
    function (r) { return !r.listo && tiene(r.bloqueos, 'IMPRESORA_CON_PROBLEMA'); });
  caso('Solo digital + impresora con problema: ni la mira', function (e) { e.evento.entrega.modo = 'digital'; e.vivo.impresora = { estado: 'error' }; },
    function (r) { return !tiene(r.bloqueos, 'IMPRESORA_CON_PROBLEMA') && !tiene(r.avisos, 'IMPRESORA_NO_COMPROBABLE'); });
  caso('Impresión + impresora no detectable (null): solo avisa (IMPRESORA_NO_COMPROBABLE)', function (e) { e.evento.entrega.modo = 'impresion'; e.vivo.impresora = null; },
    function (r) { return r.listo && tiene(r.avisos, 'IMPRESORA_NO_COMPROBABLE') && !tiene(r.bloqueos, 'IMPRESORA_CON_PROBLEMA'); });
  caso('Ambos + impresora null: solo avisa', function (e) { e.vivo.impresora = null; },
    function (r) { return r.listo && tiene(r.avisos, 'IMPRESORA_NO_COMPROBABLE'); });
  caso('Impresora ocupada imprimiendo: no es un problema', function (e) { e.vivo.impresora.estado = 'ocupada'; },
    function (r) { return r.listo; });
  caso('Papel de la plantilla no coincide con el medio de la impresora: avisa (PAPEL_DISTINTO)', function (e) { e.vivo.impresora.medios = [{ anchoMm: 127, altoMm: 178 }]; },
    function (r) { return r.listo && tiene(r.avisos, 'PAPEL_DISTINTO'); });
  caso('Impresora sin lista de medios: no avisa por papel', function (e) { delete e.vivo.impresora.medios; },
    function (r) { return !tiene(r.avisos, 'PAPEL_DISTINTO'); });
  caso('Tira 2×6 duplicada coincide con el medio 4×6 en cualquier orientación', function (e) { e.vivo.impresora.medios = [{ anchoMm: 152.4, altoMm: 101.6 }]; },
    function (r) { return !tiene(r.avisos, 'PAPEL_DISTINTO'); });
  caso('Copias × tiempo de impresión mayor que la sesión: avisa (IMPRESION_MAS_LENTA_QUE_SESION)', function (e) { e.evento.entrega.copias = 3; },
    function (r) { return r.listo && tiene(r.avisos, 'IMPRESION_MAS_LENTA_QUE_SESION') && r.ritmo.impresion.estado === 'mas-lenta'; });
  caso('Sin dato de tiempo de impresión: no avisa y el ritmo dice "sin dato"', function (e) { delete e.vivo.impresora.segundosPorHoja; e.evento.entrega.copias = 10; },
    function (r) { return !tiene(r.avisos, 'IMPRESION_MAS_LENTA_QUE_SESION') && r.ritmo.impresion.estado === 'sin-dato' && /sin dato/.test(r.ritmo.texto); });

  // Revisión del Code Reviewer
  caso('Plantilla borrada pero el evento tiene copia congelada: no bloquea, avisa (PLANTILLA_SOLO_COPIA_CONGELADA)', function (e) { e.plantilla = null; e.evento.congelado = { plantilla: { id: 'pl-1', huella: 'h-abc', nombre: 'X' } }; },
    function (r) { return r.listo && tiene(r.avisos, 'PLANTILLA_SOLO_COPIA_CONGELADA') && !tiene(r.bloqueos, 'PLANTILLA_NO_ENCONTRADA'); });
  caso('Plantilla ilegible aunque haya copia congelada: sigue bloqueando', function (e) { e.plantilla = V.ILEGIBLE; e.evento.congelado = { plantilla: { huella: 'h-abc' } }; },
    function (r) { return tiene(r.bloqueos, 'PLANTILLA_ILEGIBLE'); });
  caso('Sin plantilla asignada con copia congelada: sigue bloqueando', function (e) { e.plantilla = null; e.evento.plantillas.porDefecto = null; e.evento.congelado = { plantilla: { huella: 'h-abc' } }; },
    function (r) { return tiene(r.bloqueos, 'PLANTILLA_SIN_ASIGNAR'); });
  caso('Cuenta y pausa negativas: el ritmo no da negativos ni Infinity', function (e) { e.evento.ritmo.cuentaSeg = -50; e.evento.ritmo.pausaSeg = -50; },
    function (r) { return r.configuracion.cuentaSeg === 0 && r.configuracion.pausaSeg === 0 && r.ritmo.segundosPorSesion > 0 && isFinite(r.ritmo.sesionesPorHora); });
  caso('Copias 0 o negativas se acotan a 1', function (e) { e.evento.entrega.copias = -3; }, function (r) { return r.configuracion.copias === 1; });
  caso('Estado de impresora "desconocido": aviso de no comprobable, no bloqueo', function (e) { e.vivo.impresora = { estado: 'desconocido' }; },
    function (r) { return r.listo && tiene(r.avisos, 'IMPRESORA_NO_COMPROBABLE'); });
  caso('Estado de impresora "unknown": aviso de no comprobable, no bloqueo', function (e) { e.vivo.impresora = { estado: 'unknown' }; },
    function (r) { return r.listo && tiene(r.avisos, 'IMPRESORA_NO_COMPROBABLE') && !tiene(r.bloqueos, 'IMPRESORA_CON_PROBLEMA'); });

  // Equipo, disco, tope, digital
  caso('Sin PIN creado: avisa (PIN_SIN_CREAR) y no bloquea', function (e) { e.equipo.pin.definido = false; },
    function (r) { return r.listo && tiene(r.avisos, 'PIN_SIN_CREAR'); });
  caso('Sin dato del equipo: no se evalúa el PIN', function (e) { e.equipo = null; }, function (r) { return !tiene(r.avisos, 'PIN_SIN_CREAR'); });
  caso('Disco casi lleno (100 MB): bloquea (DISCO_LLENO)', function (e) { e.vivo.espacioLibreMB = 100; },
    function (r) { return !r.listo && tiene(r.bloqueos, 'DISCO_LLENO'); });
  caso('Disco justo (500 MB): avisa (DISCO_POCO)', function (e) { e.vivo.espacioLibreMB = 500; },
    function (r) { return r.listo && tiene(r.avisos, 'DISCO_POCO'); });
  caso('Disco sin dato (null): no hace nada', function (e) { e.vivo.espacioLibreMB = null; },
    function (r) { return r.listo && !tiene(r.avisos, 'DISCO_POCO') && !tiene(r.bloqueos, 'DISCO_LLENO'); });
  caso('Tope con entrega digital (ambos): vale y queda en la configuración', function (e) { e.evento.entrega.topeHojas = 100; },
    function (r) { return r.configuracion.topeHojas === 100 && !tiene(r.avisos, 'TOPE_NO_APLICA'); });
  caso('Tope en solo impresión: avisa que no aplica y queda sin tope', function (e) { e.evento.entrega.modo = 'impresion'; e.evento.entrega.topeHojas = 100; },
    function (r) { return tiene(r.avisos, 'TOPE_NO_APLICA') && r.configuracion.topeHojas === null; });
  caso('Solo digital sin servidor local: avisa (DIGITAL_SIN_SERVIDOR), no bloquea', function (e) { e.evento.entrega.modo = 'digital'; },
    function (r) { return r.listo && tiene(r.avisos, 'DIGITAL_SIN_SERVIDOR'); });
  caso('Solo digital con servidor local: sin aviso de servidor', function (e) { e.evento.entrega.modo = 'digital'; e.equipo.servidorLocal = true; },
    function (r) { return !tiene(r.avisos, 'DIGITAL_SIN_SERVIDOR'); });

  // Configuración efectiva y ritmo
  caso('Configuración efectiva: fotos, papel, modo, copias, cuenta, pausa, impresión automática', function (e) { e.evento.entrega.copias = 2; },
    function (r) {
      var c = r.configuracion;
      return c.fotos === 3 && c.modo === 'ambos' && c.copias === 2 && c.cuentaSeg === 3 && c.pausaSeg === 3 && c.impresionAuto === true &&
        c.papel.anchoMm === 50.8 && /3 fotos/.test(c.resumen) && /duplicada en hoja 4 × 6 in/.test(c.resumen) && /2 copias/.test(c.resumen);
    });
  caso('Ritmo: 3 fotos, cuenta 3, pausa 3 = 3×3 + 2×3 + revisión + composición', function (e) {},
    function (r) { return r.ritmo.segundosPorSesion === 9 + 6 + V.RITMO.REVISION_SEG + V.RITMO.COMPOSICION_SEG && r.ritmo.sesionesPorHora === Math.floor(3600 / r.ritmo.segundosPorSesion) && /por sesión/.test(r.ritmo.texto); });
  caso('Ritmo con 1 foto: no resta pausas negativas', function (e) { e.plantilla = plantilla(1); e.evento.ritmo.pausaSeg = 10; },
    function (r) { return r.ritmo.segundosPorSesion === 3 + V.RITMO.REVISION_SEG + V.RITMO.COMPOSICION_SEG; });
  caso('Ritmo sin plantilla: no disponible y no inventa números', function (e) { e.plantilla = null; },
    function (r) { return r.ritmo.disponible === false && r.ritmo.segundosPorSesion === null && r.configuracion.fotos === null; });
  caso('Ritmo en solo digital: sin comparación de impresión', function (e) { e.evento.entrega.modo = 'digital'; },
    function (r) { return r.ritmo.disponible && r.ritmo.impresion === null; });
  caso('Valores de ritmo ausentes en el evento: usa 3 s por defecto', function (e) { delete e.evento.ritmo; },
    function (r) { return r.configuracion.cuentaSeg === 3 && r.configuracion.pausaSeg === 3; });
  // Hito 1.2: la configuración que se congela sale del validador (ya no se arma a mano en la cabina)
  caso('Configuración efectiva incluye mensaje de pausa, paciencia y espejo del evento', function (e) { e.evento.ritmo.mensajePausa = 'Sonríe'; e.evento.ritmo.pacienciaSeg = 45; e.evento.preferenciasDeEquipo = { camara: { espejo: false } }; },
    function (r) { var c = r.configuracion; return c.mensajePausa === 'Sonríe' && c.pacienciaSeg === 45 && c.espejo === false; });
  caso('Configuración efectiva: sin preferencias de cámara el espejo es true; sin mensaje, el de siempre', function (e) { delete e.evento.preferenciasDeEquipo; e.evento.ritmo.mensajePausa = ''; delete e.evento.ritmo.pacienciaSeg; },
    function (r) { var c = r.configuracion; return c.espejo === true && c.mensajePausa === '¡Cambia de pose!' && c.pacienciaSeg === 30; });
  caso('configuracionEfectiva() da lo mismo que validar().configuracion', function (e) { e.evento.entrega.copias = 4; e.evento.entrega.topeHojas = 50; }, function () {
    var ent = base(); ent.evento.entrega.copias = 4; ent.evento.entrega.topeHojas = 50;
    return JSON.stringify(V.configuracionEfectiva(ent.evento, ent.plantilla)) === JSON.stringify(V.validar(ent).configuracion);
  });
  caso('configuracionEfectiva() no revienta con entradas rotas', function (e) {}, function () {
    var a = V.configuracionEfectiva(null, null), b = V.configuracionEfectiva('x', 5), c = V.configuracionEfectiva({});
    return a.fotos === null && b.modo === 'ambos' && c.copias === 1;
  });
  caso('configuracionEfectiva() con fotos forzadas (demostración sin plantilla): usa ese número y el resumen lo dice', function (e) {}, function () {
    var c = V.configuracionEfectiva(evento(), null, { fotos: 2 });
    return c.fotos === 2 && /2 fotos/.test(c.resumen);
  });
  caso('Con plantilla, las fotos salen de la plantilla aunque se fuercen otras', function (e) {}, function () {
    return V.configuracionEfectiva(evento(), plantilla(3), { fotos: 9 }).fotos === 3;
  });
  caso('Tope inválido (0, negativo, texto) no cuenta como tope', function (e) {}, function () {
    return [0, -5, 'cien', NaN, null].every(function (t) { var ev = evento(); ev.entrega.topeHojas = t; return V.configuracionEfectiva(ev, plantilla(3)).topeHojas === null; });
  });
  caso('Varias plantillas habilitadas: el validador revisa solo la por defecto', function (e) { e.evento.plantillas = { habilitadas: ['pl-1', 'pl-2', 'pl-3'], porDefecto: 'pl-1' }; },
    function (r) { return r.listo && r.configuracion.fotos === 3; });
  caso('El tope aparece en la configuración solo con entrega digital', function (e) { e.evento.entrega.topeHojas = 80; }, function () {
    var tope = function (m) { var ev = evento(); ev.entrega.modo = m; ev.entrega.topeHojas = 80; return V.configuracionEfectiva(ev, plantilla(3)).topeHojas; };
    return tope('impresion') === null && tope('digital') === null && tope('ambos') === 80;
  });
  caso('Un cambio de regla es de un solo lugar: los códigos publicados existen', function (e) {},
    function () { return V.CODIGOS.length >= 18 && V.CODIGOS.every(function (c, i) { return V.CODIGOS.indexOf(c) === i; }); });
  caso('El validador no modifica lo que recibe', function (e) {}, function () {
    var ent = base(); var antes = JSON.stringify(ent); V.validar(ent); return JSON.stringify(ent) === antes;
  });

  // ---------- Ejecución ----------
  var filas = document.getElementById('filas');
  var pasan = 0;
  casos.forEach(function (c) {
    var ok = false, error = '';
    try {
      var ent = base();
      c.cambiar(ent);
      var res = V.validar(ent);
      ok = !!c.espera(res);
      if (!ok) error = 'bloqueos: ' + codigos(res.bloqueos).join(', ') + ' · avisos: ' + codigos(res.avisos).join(', ');
    } catch (e) {
      error = 'excepción: ' + e.message;
    }
    if (ok) pasan++;
    var tr = document.createElement('tr');
    var td1 = document.createElement('td'); td1.className = 'estado ' + (ok ? 'pasa' : 'falla'); td1.textContent = ok ? 'PASA' : 'FALLA';
    var td2 = document.createElement('td'); td2.textContent = c.nombre;
    if (error) { var s = document.createElement('small'); s.textContent = error; td2.appendChild(s); }
    tr.appendChild(td1); tr.appendChild(td2); filas.appendChild(tr);
  });
  var total = document.getElementById('total');
  var cuenta = { pasan: pasan, total: casos.length };
  function pintarTotal() {
    total.textContent = cuenta.pasan + ' de ' + cuenta.total + ' casos pasan' + (cuenta.pasan === cuenta.total ? ' — TODO PASA' : ' — HAY FALLAS');
    total.className = cuenta.pasan === cuenta.total ? 'ok' : 'mal';
    document.title = (cuenta.pasan === cuenta.total ? 'PASA ' : 'FALLA ') + cuenta.pasan + '/' + cuenta.total;
  }
  pintarTotal();
  // Los casos de más abajo (respaldo y ciclo de vida) usan esta función para sumarse al mismo total.
  window.registrarCaso = function (nombre, ok, error) {
    cuenta.total += 1;
    if (ok) cuenta.pasan += 1;
    var tr = document.createElement('tr');
    var td1 = document.createElement('td'); td1.className = 'estado ' + (ok ? 'pasa' : 'falla'); td1.textContent = ok ? 'PASA' : 'FALLA';
    var td2 = document.createElement('td'); td2.textContent = nombre;
    if (error) { var s = document.createElement('small'); s.textContent = error; td2.appendChild(s); }
    tr.appendChild(td1); tr.appendChild(td2); filas.appendChild(tr);
    pintarTotal();
  };
})();

<script>
// ---------- Respaldo (hito 1.6): ZIP, manifest, paquetes y ciclo de vida del almacén ----------
// Sin dependencias. NO toca el localStorage real: antes de usar los almacenes se sustituye window.localStorage por un
// doble en memoria (y al final se comprueba que lo real quedó igual). Las pruebas del ZIP y del manifest son funciones puras.
(function () {
  'use strict';
  var R = Respaldo;
  var enc = new TextEncoder();

  // --- doble de localStorage ---
  var memoria = {};
  var doble = {
    getItem: function (k) { return Object.prototype.hasOwnProperty.call(memoria, k) ? memoria[k] : null; },
    setItem: function (k, v) { memoria[k] = String(v); },
    removeItem: function (k) { delete memoria[k]; },
    clear: function () { memoria = {}; },
  };
  var realAntes = null, original = null, aislado = false;
  try { realAntes = window.localStorage.getItem('fotocabina-eventos'); } catch (e) { realAntes = null; }
  try {
    original = Object.getOwnPropertyDescriptor(window, 'localStorage');
    Object.defineProperty(window, 'localStorage', { configurable: true, get: function () { return doble; } });
    aislado = window.localStorage === doble;
  } catch (e) { aislado = false; }

  var pruebas = [];
  function prueba(nombre, fn, usaAlmacen) { pruebas.push({ nombre: nombre, fn: fn, usaAlmacen: !!usaAlmacen }); }
  function aserta(c, msg) { if (!c) throw new Error(msg || 'no se cumple'); }
  function rechaza(promesa, codigo) {
    return promesa.then(function () { throw new Error('debía rechazar con ' + codigo); }, function (e) { if (e.codigo !== codigo) throw new Error('código ' + e.codigo + ' en vez de ' + codigo + ' (' + e.message + ')'); });
  }
  function bytes(n, s) { var u = new Uint8Array(n); for (var i = 0; i < n; i++) u[i] = (i * 7 + s) & 255; return u; }
  async function iguales(a, b) { var x = new Uint8Array(await a.arrayBuffer()), y = new Uint8Array(await b.arrayBuffer()); if (x.length !== y.length) return false; for (var i = 0; i < x.length; i++) if (x[i] !== y[i]) return false; return true; }

  // ===== ZIP y CRC =====
  prueba('CRC32 de "123456789" es 0xCBF43926 y se puede seguir por trozos', async function () {
    var d = enc.encode('123456789');
    aserta(R.crc32(d) === 0xCBF43926, 'crc distinto');
    aserta(R.crc32(d.subarray(4), R.crc32(d.subarray(0, 4))) === 0xCBF43926, 'por trozos');
  });
  prueba('ZIP: ida y vuelta con nombres con tildes, archivo vacío y un binario de más de 4 MB', async function () {
    var grande = new Blob([bytes(4500000, 3)]);
    var zip = await R.abrirZip(await R.crearZip([
      { nombre: 'datos/canción-ñandú.json', datos: '{"a":"ñ"}' },
      { nombre: 'vacio.bin', datos: new Uint8Array(0) },
      { nombre: 'archivos/000001.bin', datos: grande },
    ]));
    aserta(zip.entradas.length === 3, 'entradas');
    for (var i = 0; i < zip.entradas.length; i++) await zip.verificar(zip.entradas[i]);
    aserta(await zip.leerTexto(zip.porNombre.get('datos/canción-ñandú.json')) === '{"a":"ñ"}', 'texto con tildes');
    aserta(zip.porNombre.get('vacio.bin').tamano === 0, 'vacío');
    aserta(await iguales(await zip.abrirDatos(zip.porNombre.get('archivos/000001.bin')), grande), 'los bytes del binario cambiaron');
  });
  prueba('ZIP: los registros ZIP64 (forzados) también se leen de vuelta', async function () {
    var zip = await R.abrirZip(await R.crearZip([{ nombre: 'a.txt', datos: 'hola' }, { nombre: 'b/ñ.txt', datos: 'mundo' }], { forzarZip64: true }));
    aserta(zip.entradas.length === 2, 'entradas');
    await zip.verificar(zip.porNombre.get('b/ñ.txt'));
    aserta(await zip.leerTexto(zip.porNombre.get('a.txt')) === 'hola', 'texto');
  });
  prueba('ZIP: un byte cambiado hace fallar el CRC (CORRUPTO)', async function () {
    var blob = await R.crearZip([{ nombre: 'a.txt', datos: 'hola mundo, esto se va a corromper' }]);
    var b = new Uint8Array(await blob.arrayBuffer()); b[30 + 5 + 3] ^= 0xFF;
    var zip = await R.abrirZip(new Blob([b]));
    await rechaza(zip.verificar(zip.entradas[0]), 'CORRUPTO');
  });
  prueba('ZIP: un archivo que no es ZIP se rechaza (NO_ES_ZIP), también vacío o diminuto', async function () {
    await rechaza(R.abrirZip(new Blob([enc.encode('esto es solo texto, de más de veintidós bytes')])), 'NO_ES_ZIP');
    await rechaza(R.abrirZip(new Blob([])), 'NO_ES_ZIP');
    await rechaza(R.abrirZip(new Blob([enc.encode('PK')])), 'NO_ES_ZIP');
  });
  prueba('ZIP: una entrada con compresión se rechaza con mensaje claro (COMPRIMIDO)', async function () {
    var blob = await R.crearZip([{ nombre: 'a.txt', datos: 'hola' }]);
    var b = new Uint8Array(await blob.arrayBuffer());
    for (var i = 0; i < b.length - 4; i++) if (b[i] === 0x50 && b[i + 1] === 0x4b && b[i + 2] === 1 && b[i + 3] === 2) { b[i + 10] = 8; break; }
    await rechaza(R.abrirZip(new Blob([b])), 'COMPRIMIDO');
  });
  prueba('ZIP: un directorio central cortado se rechaza sin lanzar excepciones raras (CORRUPTO o NO_ES_ZIP)', async function () {
    var blob = await R.crearZip([{ nombre: 'a.txt', datos: 'hola' }, { nombre: 'b.txt', datos: 'chao' }]);
    var b = new Uint8Array(await blob.arrayBuffer());
    var cortado = new Blob([b.subarray(0, b.length - 30)]);
    try { await R.abrirZip(cortado); throw new Error('debía rechazar'); } catch (e) { aserta(e.codigo === 'CORRUPTO' || e.codigo === 'NO_ES_ZIP', 'código ' + e.codigo); }
  });

  // ===== manifest =====
  function manifestBase(extra) {
    var m = { app: 'FotoCabina', formato: 1, tipo: 'respaldo', creadoEn: '2026-11-17T12:00:00.000Z', conFotos: true, conteos: { eventos: 0, plantillas: 0, sesiones: 0, archivos: 0, fotos: 0, congeladas: 0 } };
    for (var k in (extra || {})) m[k] = extra[k];
    return m;
  }
  prueba('Manifest: uno válido se acepta', async function () { aserta(R.validarManifest(manifestBase()).ok, 'debía aceptarlo'); });
  prueba('Manifest: de una versión futura se rechaza con mensaje claro (VERSION_NUEVA)', async function () {
    var r = R.validarManifest(manifestBase({ formato: R.FORMATO + 1 }));
    aserta(!r.ok && r.codigo === 'VERSION_NUEVA' && /más nueva/.test(r.mensaje), 'no lo rechazó como versión nueva');
  });
  prueba('Manifest: sin app de FotoCabina, sin tipo o con conteos rotos se rechaza', async function () {
    aserta(R.validarManifest(manifestBase({ app: 'Otra' })).codigo === 'NO_ES_FOTOCABINA', 'app');
    aserta(R.validarManifest(null).codigo === 'NO_ES_FOTOCABINA', 'null');
    aserta(R.validarManifest(manifestBase({ tipo: 'raro' })).codigo === 'ESTRUCTURA', 'tipo');
    aserta(R.validarManifest(manifestBase({ conteos: { eventos: -1, plantillas: 0, sesiones: 0, archivos: 0, fotos: 0, congeladas: 0 } })).codigo === 'ESTRUCTURA', 'conteos');
    aserta(R.validarManifest(manifestBase({ formato: 0 })).codigo === 'ESTRUCTURA', 'formato 0');
  });
  prueba('Nombres de archivo: respaldo y evento (con tildes y símbolos limpiados)', async function () {
    var f = new Date(2026, 10, 17);
    aserta(R.nombreRespaldo(f) === 'fotocabina-respaldo-2026-11-17.zip', R.nombreRespaldo(f));
    aserta(R.nombreArchivoEvento('Boda de Ñandú & Fran ¡2026!', f) === 'evento-boda-de-nandu-fran-2026-2026-11-17.zip', R.nombreArchivoEvento('Boda de Ñandú & Fran ¡2026!', f));
    aserta(/^evento-sin-nombre-/.test(R.nombreArchivoEvento('¡¡¡', f)), 'sin nombre');
  });

  // ===== leerPaquete (valida sin escribir) =====
  function entradasPaquete(m, extra) {
    var e = [
      { nombre: 'manifest.json', datos: JSON.stringify(m) },
      { nombre: 'datos/eventos.json', datos: '[]' }, { nombre: 'datos/contadores.json', datos: '{}' }, { nombre: 'datos/plantillas.json', datos: 'null' },
      { nombre: 'datos/sesiones.json', datos: '[]' }, { nombre: 'datos/archivos.json', datos: '[]' }, { nombre: 'datos/congeladas.json', datos: '[]' },
    ];
    return e.concat(extra || []);
  }
  prueba('Paquete: uno mínimo válido se lee y se resume sin tocar ningún almacén', async function () {
    var p = await R.leerPaquete(new File([await R.crearZip(entradasPaquete(manifestBase()))], 'r.zip'));
    aserta(p.tipo === 'respaldo' && p.resumen.eventos === 0 && p.resumen.conFotos === true, 'resumen');
  });
  prueba('Paquete: de versión futura, ZIP ajeno y texto se rechazan antes de leer los datos', async function () {
    await rechaza(R.leerPaquete(new File([await R.crearZip(entradasPaquete(manifestBase({ formato: 99 })))], 'f.zip')), 'VERSION_NUEVA');
    await rechaza(R.leerPaquete(new File([await R.crearZip([{ nombre: 'hola.txt', datos: 'hola' }])], 'a.zip')), 'NO_ES_FOTOCABINA');
    await rechaza(R.leerPaquete(new File([enc.encode('no soy un zip, pero soy largo para pasar el mínimo')], 't.zip')), 'NO_ES_ZIP');
  });
  prueba('Paquete: datos dañados (CRC malo en un dato) se rechazan (CORRUPTO)', async function () {
    var blob = await R.crearZip(entradasPaquete(manifestBase(), [{ nombre: 'extra.txt', datos: 'AAAAAAAAAAAAAAAAAAAA' }]));
    var b = new Uint8Array(await blob.arrayBuffer());
    var s = enc.encode('AAAAAAAAAAAAAAAAAAAA'), pos = -1;
    for (var i = 0; i < b.length - s.length; i++) { var ok = true; for (var j = 0; j < s.length; j++) if (b[i + j] !== s[j]) { ok = false; break; } if (ok) { pos = i; break; } }
    aserta(pos >= 0, 'no se halló el dato'); b[pos + 3] = 66;
    await rechaza(R.leerPaquete(new File([b], 'c.zip')), 'CORRUPTO');
  });
  prueba('Paquete: conteos que no cuadran o sesiones con archivos faltantes se rechazan (ESTRUCTURA)', async function () {
    var m = manifestBase({ conteos: { eventos: 5, plantillas: 0, sesiones: 0, archivos: 0, fotos: 0, congeladas: 0 } });
    await rechaza(R.leerPaquete(new File([await R.crearZip(entradasPaquete(m))], 'e.zip')), 'ESTRUCTURA');
    var m2 = manifestBase({ conteos: { eventos: 0, plantillas: 0, sesiones: 1, archivos: 1, fotos: 1, congeladas: 0 } });
    var e = entradasPaquete(m2).map(function (x) {
      if (x.nombre === 'datos/sesiones.json') return { nombre: x.nombre, datos: '[{"id":"s-1"}]' };
      if (x.nombre === 'datos/archivos.json') return { nombre: x.nombre, datos: '[{"id":"f-s-1-foto1","sesionId":"s-1","tipo":"foto","tamano":3,"entrada":"archivos/000001.bin"}]' };
      return x;
    });
    await rechaza(R.leerPaquete(new File([await R.crearZip(e)], 'g.zip')), 'ESTRUCTURA');

    var m = manifestBase({ conFotos: false, conteos: { eventos: 0, plantillas: 0, sesiones: 1, archivos: 0, fotos: 0, congeladas: 0 } });
    var e = entradasPaquete(m).map(function (x) { return x.nombre === 'datos/sesiones.json' ? { nombre: x.nombre, datos: '[{"id":"s-1"}]' } : x; });
    await rechaza(R.leerPaquete(new File([await R.crearZip(e)], 'h.zip')), 'ESTRUCTURA');
  });

  // ===== Sesiones del formato antiguo (v1): Blob dentro del registro =====
  prueba('Sesión v1 (tira y gif como Blob dentro del registro): ida y vuelta por el ZIP con los mismos bytes', async function () {
    var tira = new Blob([bytes(6000, 5)], { type: 'image/png' }), gif = new Blob([bytes(2500, 8)], { type: 'image/gif' });
    var v1 = { id: 's-v1', evento: 'ev-1', fecha: '2026-01-01T00:00:00Z', fotos: ['data:image/jpeg;base64,AAAA', 'data:image/jpeg;base64,BBBB'], tira: tira, gif: gif };
    var v2 = { id: 's-v2', version: 2, eventoId: 'ev-1', fotos: [], salidas: {} };
    aserta(JSON.parse(JSON.stringify(v1)).tira && Object.keys(JSON.parse(JSON.stringify(v1)).tira).length === 0, 'sin la corrección JSON los dejaría vacíos');

    var zip = await R.abrirZip(await R.crearZip([{ nombre: 'sesiones.json', datos: JSON.stringify(ext.sesiones) }, { nombre: 'archivos.json', datos: JSON.stringify(meta) }].concat(ext.extras.map(function (a, i) { return { nombre: meta[i].entrada, datos: a.blob }; }))));
    var sesLeidas = JSON.parse(await zip.leerTexto(zip.porNombre.get('sesiones.json')));
    var metaLeida = JSON.parse(await zip.leerTexto(zip.porNombre.get('archivos.json')));

    var rep = R.reponerBlobsV1(sesLeidas, preparados);

    aserta(rep.sesiones[0].fotos.length === 2 && rep.sesiones[0].fotos[0] === v1.fotos[0], 'fotos como texto');

    aserta(rep.sesiones[1].id === 's-v2' && rep.sesiones[1].version === 2, 'la v2 no cambia');
  });

  // ===== Avisos de lectura (nunca un respaldo "completo" en silencio) =====
  prueba('Plantillas del editor dañadas: estadoContenedorParaRespaldo lo distingue de "no hay nada"', async function () {

  }, true);
  prueba('Eventos dañados: exportarCrudo marca ilegible y no inventa eventos', async function () {
    memoria = {}; doble.setItem('fotocabina-eventos', '{roto');
    var x = AlmacenEventos.exportarCrudo();
    aserta(x.ilegible === true && x.eventos.length === 0, 'debía marcar ilegible');
    memoria = {}; aserta(AlmacenEventos.exportarCrudo().ilegible === false, 'vacío no es ilegible');
  }, true);

  // ===== AlmacenEventos con localStorage en memoria =====
  var A = AlmacenEventos;

  function reiniciar() { memoria = {}; }

  prueba('Ciclo de vida: marcarEnCurso pasa un próximo a en curso, anota lanzadoEn una sola vez y no baja a otros', async function () {
    reiniciar(); var a = nuevoEvento('A'), b = nuevoEvento('B');

  }, true);

  }, true);

    var r = A.terminar(a); aserta(r.estado === 'archivado' && !!r.terminadoEn, 'no archivó');

    var t = r.terminadoEn; aserta(A.terminar(a).terminadoEn === t, 'cambió la hora de término');
  }, true);

  }, true);

  // ===== importarCrudo / exportarCrudo / instantáneas =====
  function evCrudo(id, nombre) { return { version: 2, id: id, nombre: nombre, fecha: '2026-12-01', estado: 'proximo' }; }
  prueba('Respaldo de eventos: exportarCrudo en un equipo vacío no inventa los eventos de demostración', async function () {
    reiniciar(); var x = A.exportarCrudo(); aserta(x.eventos.length === 0, 'creó eventos'); aserta(doble.getItem('fotocabina-eventos') === null, 'escribió sin pedirlo');
  }, true);
  prueba('Respaldo de eventos: sumar no pisa lo existente (gana lo que ya está) y es idempotente', async function () {
    reiniciar(); var id = nuevoEvento('Original');
    var datos = { eventos: [evCrudo(id, 'DEL RESPALDO'), evCrudo('ev-nuevo', 'Nuevo')], contadores: { 'ev-nuevo': 7 } };
    var r1 = A.importarCrudo(datos, { modo: 'sumar' }); var r2 = A.importarCrudo(datos, { modo: 'sumar' });
    aserta(r1.agregados === 1 && r1.omitidos === 1 && r2.agregados === 0 && r2.omitidos === 2, JSON.stringify([r1, r2]));
    var lista = A.exportarCrudo(); aserta(lista.eventos.filter(function (e) { return e.id === id; }).length === 1 && lista.eventos.filter(function (e) { return e.id === id; })[0].nombre === 'Original' && lista.eventos.filter(function (e) { return e.id === 'ev-nuevo'; }).length === 1, 'pisó el existente o duplicó');
    aserta(lista.contadores['ev-nuevo'] === 7, 'contador');
  }, true);
  prueba('Respaldo de eventos: reemplazar deja exactamente el respaldo y suelta el evento activo', async function () {
    reiniciar(); var id = nuevoEvento('Viejo'); A.setActivo(id);
    var r = A.importarCrudo({ eventos: [evCrudo('ev-a', 'A')], contadores: {} }, { modo: 'reemplazar' });
    aserta(r.agregados === 1 && A.exportarCrudo().eventos.length === 1 && A.exportarCrudo().eventos[0].id === 'ev-a', 'no quedó exacto');
    aserta(doble.getItem('fotocabina-evento-activo') === null, 'siguió el activo');
  }, true);
  prueba('Respaldo de eventos: los contadores quedan en el mayor valor (nunca repiten un número de sesión)', async function () {
    reiniciar(); var id = nuevoEvento('C');
    doble.setItem('fotocabina-eventos-contadores', JSON.stringify((function () { var o = {}; o[id] = 10; return o; })()));
    var c = {}; c[id] = 4; var m = {}; m[id] = 25;
    A.importarCrudo({ eventos: [evCrudo(id, 'C')], contadores: c }, { modo: 'sumar', minimos: m });
    aserta(A.siguienteNumeroSesion(id, 0) === 26, 'el siguiente debía ser 26');
  }, true);
  prueba('Respaldo de eventos: la instantánea devuelve las claves exactas (también las que no existían)', async function () {
    reiniciar(); var id = nuevoEvento('S'); A.setActivo(id);
    var snap = A.tomarInstantanea(); var antes = JSON.stringify(memoria);
    A.importarCrudo({ eventos: [evCrudo('ev-x', 'X')], contadores: { 'ev-x': 3 } }, { modo: 'reemplazar' });
    aserta(JSON.stringify(memoria) !== antes, 'no cambió nada para deshacer');
    A.devolverInstantanea(snap); aserta(JSON.stringify(memoria) === antes, 'no volvió igual');
    reiniciar(); var vacia = A.tomarInstantanea(); A.importarCrudo({ eventos: [evCrudo('ev-y', 'Y')], contadores: {} }, { modo: 'sumar' });
    A.devolverInstantanea(vacia); aserta(doble.getItem('fotocabina-eventos') === null, 'una clave que no existía debía borrarse');
  }, true);
  prueba('Respaldo de eventos: si no hay espacio para guardar, importarCrudo lanza (y se puede deshacer)', async function () {
    reiniciar(); nuevoEvento('Q'); var snap = A.tomarInstantanea(); var antes = JSON.stringify(memoria);
    var set = doble.setItem; doble.setItem = function () { throw new Error('cuota'); };
    var fallo = false; try { A.importarCrudo({ eventos: [evCrudo('ev-z', 'Z')], contadores: {} }, { modo: 'sumar' }); } catch (e) { fallo = true; }
    doble.setItem = set; A.devolverInstantanea(snap);
    aserta(fallo, 'debía lanzar'); aserta(JSON.stringify(memoria) === antes, 'quedó distinto');
  }, true);

  // ===== AlmacenPlantillas (excepción de respaldo) =====
  var P = AlmacenPlantillas;
  function tpl(id) { return { id: id, nombre: 'T ' + id, papel: { anchoMm: 50.8, altoMm: 152.4, ppp: 300 }, elementos: [] }; }
  prueba('Plantillas: agregar suma las nuevas, omite las que ya existen y conserva ultimaAbierta válido', async function () {
    reiniciar(); doble.setItem('fotocabina-editor-v1', JSON.stringify({ plantillas: [tpl('a')], ultimaAbierta: 'a' }));
    var r = P.agregarPlantillasDesdeRespaldo([tpl('a'), tpl('b')], { ultimaAbierta: 'b' });
    var c = P.leerContenedorParaRespaldo();
    aserta(r.agregadas === 1 && r.omitidas === 1 && c.plantillas.length === 2 && c.ultimaAbierta === 'a', JSON.stringify(r) + c.ultimaAbierta);
  });
  prueba('Plantillas: reemplazar deja el contenedor del respaldo (ultimaAbierta corregida si no existe) y null lo borra', async function () {
    reiniciar(); P.reemplazarContenedorDesdeRespaldo({ plantillas: [tpl('x'), tpl('y')], ultimaAbierta: 'zzz' });
    aserta(P.leerContenedorParaRespaldo().ultimaAbierta === 'x', 'ultimaAbierta');
    P.reemplazarContenedorDesdeRespaldo(null); aserta(P.leerContenedorParaRespaldo() === null, 'no borró');
  });
  prueba('Plantillas: la instantánea devuelve el texto exacto, incluso si no había nada', async function () {
    reiniciar(); var vacia = P.instantaneaParaRespaldo(); P.reemplazarContenedorDesdeRespaldo({ plantillas: [tpl('q')], ultimaAbierta: 'q' });
    P.devolverInstantaneaDeRespaldo(vacia); aserta(doble.getItem('fotocabina-editor-v1') === null, 'debía quedar sin la clave');
  });
  prueba('Plantillas: copiaNormalizada + huella dan la misma identidad aunque cambien la fecha y el orden de claves', async function () {
    var a = tpl('m'), b = { elementos: [], papel: { ppp: 300, altoMm: 152.4, anchoMm: 50.8 }, nombre: 'T m', id: 'm', modificada: 'otra fecha' };
    aserta(await P.huella(P.copiaNormalizada(a)) === await P.huella(P.copiaNormalizada(b)), 'huellas distintas');
    b.nombre = 'Otro'; aserta(await P.huella(P.copiaNormalizada(a)) !== await P.huella(P.copiaNormalizada(b)), 'huellas iguales con distinto contenido');
  });

  prueba('Plantillas: «Sumar» no pisa un contenedor dañado (lanza y deja el texto tal cual)', async function () {
    reiniciar(); doble.setItem('fotocabina-editor-v1', '{"plantillas": [ roto');
    var lanzo = false; try { P.agregarPlantillasDesdeRespaldo([tpl('n')], {}); } catch (e) { lanzo = true; }
    aserta(lanzo, 'debía lanzar'); aserta(doble.getItem('fotocabina-editor-v1') === '{"plantillas": [ roto', 'pisó el texto dañado');
  });
  prueba('Paquete: un archivo con tipo "text/html" entra sin tipo; uno image/png lo conserva', async function () {
    var m = manifestBase({ conteos: { eventos: 0, plantillas: 0, sesiones: 1, archivos: 2, fotos: 2, congeladas: 0 } });
    var e = entradasPaquete(m, [{ nombre: 'archivos/000001.bin', datos: 'abc' }, { nombre: 'archivos/000002.bin', datos: 'def' }]).map(function (x) {
      if (x.nombre === 'datos/sesiones.json') return { nombre: x.nombre, datos: '[{"id":"s-1"}]' };
      if (x.nombre === 'datos/archivos.json') return { nombre: x.nombre, datos: JSON.stringify([
        { id: 'a', sesionId: 's-1', tipo: 'foto', tamano: 3, mime: 'text/html', entrada: 'archivos/000001.bin' },
        { id: 'b', sesionId: 's-1', tipo: 'foto', tamano: 3, mime: 'image/png', entrada: 'archivos/000002.bin' }]) };
      return x;
    });
    var p = await R.leerPaquete(new File([await R.crearZip(e)], 'm.zip'));
    aserta((await p.blobDe(p.datos.archivos[0])).type === '', 'dejó pasar text/html');
    aserta((await p.blobDe(p.datos.archivos[1])).type === 'image/png', 'perdió image/png');
  });

  // ===== ejecución =====
  (async function () {
    for (var i = 0; i < pruebas.length; i++) {
      var p = pruebas[i], ok = false, error = '';
      if (p.usaAlmacen && !aislado) { error = 'no se pudo aislar localStorage; para no tocar tus datos reales esta prueba no se ejecuta'; }
      else {
        try { await p.fn(); ok = true; } catch (e) { error = (e && e.message) || String(e); }
      }
      window.registrarCaso('Respaldo · ' + p.nombre, ok, error);
    }
    // El localStorage real tiene que haber quedado igual.
    var igual = true;
    try { if (original) Object.defineProperty(window, 'localStorage', original); igual = window.localStorage.getItem('fotocabina-eventos') === realAntes; } catch (e) { igual = false; }
    window.registrarCaso('Respaldo · el localStorage real no se tocó (los casos usaron un doble en memoria)', igual && aislado, aislado ? '' : 'no se pudo sustituir localStorage');
  })();
})();
